[project]
name = "cortex"
version = "0.1.0"
description = "Personal AI control plane — ideas in, agents work, memory compounds, costs governed."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "typer>=0.15",
]

[project.scripts]
cortex = "cortex.cli:app"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
